<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星际快递员 - ChatGPT 小游戏</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="game-shell">
      <div class="topbar">
        <div>
          <h1>星际快递员</h1>
          <p class="subtitle">接包裹、冲刺穿越流星雨，把快递送进星际传送门！</p>
        </div>
        <div class="hud-inline">
          <div class="hud-pill">模式 <strong id="modeLabel">普通</strong></div>
          <div class="hud-pill">分数 <strong id="score">0</strong></div>
          <div class="hud-pill">最高分 <strong id="highScore">0</strong></div>
          <div class="hud-pill">生命 <strong id="lives">3</strong></div>
          <div class="hud-pill">等级 <strong id="level">1</strong></div>
          <div class="hud-pill">任务 <strong id="missionStatus">待接单</strong></div>
          <div class="hud-pill">连击 <strong id="comboStatus">x1</strong></div>
          <div class="hud-pill">冲刺 <strong id="dashStatus">可用</strong></div>
          <div class="hud-pill">状态 <strong id="powerStatus">无</strong></div>
        </div>
      </div>

      <div class="game-area">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay-card">
            <img id="splashImage" alt="机器人快递员" src="assets/splash-robot.svg" />
            <h2 id="overlayTitle">准备启程</h2>
            <p id="overlayText">
              选择难度后开始任务。接包裹、找传送门投递，利用冲刺穿过流星雨。
            </p>
            <div class="difficulty-panel" aria-label="难度选择">
              <button class="difficulty-option" data-mode="easy" type="button">
                <span>轻松</span>
                <small>生命更多，节奏更慢</small>
              </button>
              <button class="difficulty-option active" data-mode="normal" type="button">
                <span>普通</span>
                <small>标准快递任务</small>
              </button>
              <button class="difficulty-option" data-mode="hard" type="button">
                <span>困难</span>
                <small>陨石更快，得分更高</small>
              </button>
            </div>
            <div class="overlay-actions">
              <button id="startButton">开始游戏</button>
              <button id="restartButton" class="secondary hidden">重新开始</button>
            </div>
          </div>
        </div>
      </div>

      <div class="bottom-panel">
        <div class="tip-box">
          <h3>玩法说明</h3>
          <ul>
            <li>接到包裹后，限时送进传送门，可获得大量分数和投递连胜</li>
            <li>连续拾取奖励会提升连击倍率，受伤或投递超时会中断连击</li>
            <li>空格键 / 冲刺按钮可短距离冲刺，并获得极短无敌时间</li>
            <li>流星雨会定期预警，随后横向飞来高速彗星</li>
            <li>晶体、护盾、磁铁、维修包仍然会帮助你拿高分</li>
          </ul>
        </div>

        <div class="controls-box">
          <h3>触屏控制</h3>
          <div class="controls-grid">
            <button class="ctrl" data-dir="up">↑</button>
            <div></div>
            <button class="ctrl" data-dir="left">←</button>
            <button class="ctrl" data-dir="down">↓</button>
            <button class="ctrl" data-dir="right">→</button>
          </div>
          <div class="control-row">
            <button id="pauseButton" class="secondary">暂停 / 继续</button>
            <button id="dashButton" class="dash-button">冲刺</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
